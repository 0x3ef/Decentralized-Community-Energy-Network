name: solar-prototype
x-backend: &backend
  image: testp2p-api:local
  build:
    context: ../..
    dockerfile: infrastructure/docker/Dockerfile.backend
    target: api
    secrets: [proxy_ca]
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://solar:solar@timescaledb:5432/solar
    REDIS_URL: redis://redis:6379/0
    WEB3_PROVIDER_URL: http://anvil:8545
    MQTT_HOST: mosquitto
  depends_on:
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
    anvil: {condition: service_started}
services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: solar
      POSTGRES_DB: solar
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U solar -d solar"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  mosquitto:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt:/mosquitto/data
    ports: ["127.0.0.1:1883:1883"]
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.5.0
    entrypoint: [anvil, --host, 0.0.0.0, --chain-id, "31337", --block-time, "1"]
    ports: ["127.0.0.1:8545:8545"]
  migrate:
    <<: *backend
    depends_on:
      timescaledb: {condition: service_healthy}
    command: [alembic, upgrade, head]
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *backend
    command: [python, -m, src.workers.community_worker]
  subscriber:
    <<: *backend
    command: [python, -m, src.iot.mqtt_handler]
  frontend:
    image: testp2p-frontend:local
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.frontend
      secrets: [proxy_ca]
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes:
  postgres:
  mqtt:

secrets:
  proxy_ca:
    file: ${CLOUD_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
