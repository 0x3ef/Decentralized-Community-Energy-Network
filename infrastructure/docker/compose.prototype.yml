name: solar-prototype
x-backend: &backend
  image: testp2p-api:local
  build:
    context: ../..
    dockerfile: infrastructure/docker/Dockerfile.backend
    target: api
    secrets: [proxy_ca]
  env_file: .env
  volumes:
    - ${CLOUD_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/run/runtime-ca.pem:ro
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://solar:solar@timescaledb:5432/solar
    REDIS_URL: redis://redis:6379/0
    WEB3_PROVIDER_URL: http://anvil:8545
    MQTT_HOST: mosquitto
    REQUESTS_CA_BUNDLE: /run/runtime-ca.pem
    SSL_CERT_FILE: /run/runtime-ca.pem
    # Internal service DNS must bypass only the HTTP proxy, in both casings.
    NO_PROXY: localhost,127.0.0.1,::1,anvil,timescaledb,redis,mosquitto
    no_proxy: localhost,127.0.0.1,::1,anvil,timescaledb,redis,mosquitto
  depends_on:
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
    anvil: {condition: service_healthy}
    mosquitto: {condition: service_healthy}
services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: solar
      POSTGRES_DB: solar
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U solar -d solar"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  mosquitto:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt:/mosquitto/data
    ports: ["127.0.0.1:1883:1883"]
    healthcheck:
      test: [CMD-SHELL, "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 4 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
  anvil-state-init:
    image: ghcr.io/foundry-rs/foundry:v1.5.0
    user: '0:0'
    entrypoint: [sh, -c]
    command: ["chown -R 1000:1000 /state && chmod 0700 /state"]
    volumes: [anvil_state:/state]
    restart: 'no'
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.5.0
    entrypoint: [anvil, --host, 0.0.0.0, --chain-id, "31337", --block-time, "1"]
    ports: ["127.0.0.1:8545:8545"]
    volumes: [anvil_state:/state]
    command: [--state, /state/anvil.json, --state-interval, "5", --preserve-historical-states]
    stop_grace_period: 60s
    depends_on:
      anvil-state-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null && test -s /state/anvil.json"]
      interval: 5s
      timeout: 4s
      retries: 20
  migrate:
    <<: *backend
    depends_on:
      timescaledb: {condition: service_healthy}
    command: [alembic, upgrade, head]
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
  worker:
    <<: *backend
    command: [python, -m, src.workers.community_worker]
    healthcheck:
      test: [CMD, python, -m, src.core.observability, worker]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
  subscriber:
    <<: *backend
    command: [python, -m, src.iot.mqtt_handler]
    healthcheck:
      test: [CMD, python, -m, src.core.observability, subscriber]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
  frontend:
    image: testp2p-frontend:local
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        VITE_API_URL: /api/v1
        VITE_CHAIN_ID: ${CHAIN_ID:-31337}
        VITE_REGISTRY_ADDRESS: ${COMMUNITY_REGISTRY_ADDRESS:-}
        VITE_TIMELOCK_ADDRESS: ${GOVERNANCE_TIMELOCK_ADDRESS:-}
        VITE_SEPOLIA_RPC_URL: ${VITE_SEPOLIA_RPC_URL:-}
      secrets: [proxy_ca]
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres:
  mqtt:
  anvil_state:

secrets:
  proxy_ca:
    file: ${CLOUD_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
