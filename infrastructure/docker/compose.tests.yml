name: solar-prototype-tests
services:
  postgres:
    image: postgres:16.4-alpine
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: solar
      POSTGRES_DB: solar_tests
    ports: ["127.0.0.1:55432:5432"]
    tmpfs:
      - /tmp
      - /run
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U solar -d solar_tests"]
      interval: 1s
      timeout: 3s
      retries: 30
  mqtt:
    image: eclipse-mosquitto:2.0.22
    command: [mosquitto, -c, /mosquitto-no-auth.conf]
    ports: ["127.0.0.1:18884:1883"]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 15
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.5.0
    entrypoint: [anvil, --host, 0.0.0.0, --chain-id, "31337"]
    ports: ["127.0.0.1:18545:8545"]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "cast chain-id --rpc-url http://127.0.0.1:8545 | grep -qx 31337"]
      interval: 2s
      timeout: 5s
      retries: 15
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  redis:
    image: redis:7.4.0-alpine
    ports: ["127.0.0.1:16379:6379"]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 15
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
