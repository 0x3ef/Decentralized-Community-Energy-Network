# Authenticated TLS listener. Mount operator-provisioned files read-only.
listener 8883 0.0.0.0
allow_anonymous false
password_file /run/mqtt/passwords
acl_file /run/mqtt/acl
cafile /run/mqtt/tls/ca.crt
certfile /run/mqtt/tls/server.crt
keyfile /run/mqtt/tls/server.key
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
max_packet_size 70000
log_dest stdout
